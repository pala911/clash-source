name: update-source

on:
  schedule:
    # 每周一 03:17 UTC（北京 11:17）。想更鲜改成 '17 */6 * * *'（每 6 小时），
    # 但注意：仓库 60 天无活动会被 GitHub 停用定时任务（每次成功提交 dist 即可保活）。
    - cron: "17 3 * * 1"
  workflow_dispatch:        # 网页上「Run workflow」手动触发，几分钟刷完

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 抓取 12 个源本身就要 5-15 分钟（上游抖动），AI 阶段有墙钟预算兜底
    # （src/run.py 的 AI_TIME_BUDGET，默认 600s），所以给到 60 分钟绰绰有余
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑流水线（抓取→归一→硬过滤→AI→产出）
        env:
          # 多后端 AI：顺序与超时见 src/ai_backends.yaml
          AI_KEY_SILICONFLOW: ${{ secrets.AI_KEY_SILICONFLOW }}
          AI_KEY_OPENROUTER: ${{ secrets.AI_KEY_OPENROUTER }}
          # AI 阶段墙钟预算（秒）。上游延迟随机波动（实测同 prompt 在 41s~245s 之间跳），
          # 用预算兜底保证流水线不会被 CI 超时掐断；超预算后剩余源按纯规则产出。
          AI_TIME_BUDGET: "1500"
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # ⚠️ 必须是纯仓库名，不能用 github.repository（那是 owner/repo，
          #    会让 src/build.py 拼出 https://<ID>.github.io/<ID>/<repo>/ 这种坏路径）
          GITHUB_REPOSITORY: ${{ github.event.repository.name }}
        run: python src/run.py --ai-mode auto --keep-raw

      - name: 提交产物到 main（dist/ 是事实来源，reports/ 是审计留痕）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist reports
          if git diff --cached --quiet; then
            echo "本轮无变化，跳过提交"
          else
            git commit -m "chore: 源更新 $(date -u +%FT%TZ)"
            git push
          fi

      - name: 发布到 gh-pages（手机订阅站点根）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github src reports
          mv dist/* .
          rmdir dist 2>/dev/null || true
          touch .nojekyll
          git add -A
          git commit -m "pages: $(date -u +%FT%TZ)"
          git push -f origin gh-pages-new:gh-pages
          echo "订阅入口: https://${{ github.repository_owner }}.github.io/${{ github.repository }}/profile.yaml"