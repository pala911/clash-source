name: update-source

on:
  schedule:
    # 每 6 小时（UTC 03:17 / 09:17 / 15:17 / 21:17 = 北京 11:17 / 17:17 / 23:17 / 05:17）。
    #
    # 为什么是「每 6 小时」而不是原来的「每周一 03:17」：
    #   手机订阅的节点层（nodes/*.yaml）**只有这条流水线会重建** ——
    #   本机探针（L2）只推 state/，从不碰 dist/。原来一周才重建一次，
    #   等于 README 承诺的「节点保持新鲜」根本不成立。
    #
    # 为什么不是「每小时」：
    #   一轮 = 抓取+AI(~5-8min) + 全量探针(最多 40min，预算 2400s) + 提交发布，
    #   实测单轮 34~55 分钟。每小时会和上一轮重叠（靠 concurrency 排队，
    #   结果是「一直在跑」）。6 小时间隔留足余量。
    #
    # ⚠ 改频率前先想一件事：**判死**（连续 0 活 -> 降级）原来是按「轮数」计的，
    #   提速 = 判死提速（3 轮从 3 周变成 18 小时）。所以 health.py 里加了
    #   「轮次还必须横跨 ≥ 48 小时」这道闸门（DEAD_STREAK_HOURS），
    #   让判死的墙钟语义与 cron 频率解耦。改这里不必回去调那个常数。
    #
    # 仓库 60 天无活动会被 GitHub 停用定时任务（每轮成功提交 dist 即可保活）。
    - cron: "17 */6 * * *"
  workflow_dispatch:        # 网页上「Run workflow」手动触发，几分钟刷完

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 抓取 12 个源本身就要 5-15 分钟（上游抖动），AI 阶段有墙钟预算兜底
    # （src/run.py 的 AI_TIME_BUDGET，默认 600s），所以给到 60 分钟绰绰有余
    # 90 分钟：流水线 ~4 分钟 + 全量探针最多 2400s(40 分钟) + 提交/发布/缓存，
    # 留足冗余。原来 60 分钟会在探针最坏情况下被砍掉，后面的提交步骤全被跳过。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑流水线（抓取→归一→硬过滤→AI→产出）
        env:
          # 多后端 AI：顺序与超时见 src/ai_backends.yaml（腾讯 tokenhub / 硅基流动 / OpenRouter 三云冗余）
          AI_KEY_TENCENT: ${{ secrets.AI_KEY_TENCENT }}
          AI_KEY_SILICONFLOW: ${{ secrets.AI_KEY_SILICONFLOW }}
          AI_KEY_OPENROUTER: ${{ secrets.AI_KEY_OPENROUTER }}
          # AI 阶段墙钟预算（秒）。上游延迟随机波动（实测同 prompt 在 41s~245s 之间跳），
          # 用预算兜底保证流水线不会被 CI 超时掐断；超预算后剩余源按纯规则产出。
          AI_TIME_BUDGET: "1500"
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # ⚠️ 必须是纯仓库名，不能用 github.repository（那是 owner/repo，
          #    会让 src/build.py 拼出 https://<ID>.github.io/<ID>/<repo>/ 这种坏路径）
          GITHUB_REPOSITORY: ${{ github.event.repository.name }}
        run: python src/run.py --ai-mode auto --keep-raw

      - name: 提交产物到 main（dist/ 是事实来源，reports/ 是审计留痕）
        run: |
          # ⚠ 提交+推送走 tools/ci_git_push.sh（带重试，三处共用）。
          #   原来这里是裸 `git push`：2026-10-18 04:41 UTC 本机探针先推了
          #   078d4e7，CI 25 秒后拿旧基点推 -> 被拒 -> 这一步失败 -> 后面
          #   9 个步骤（含 gh-pages 发布与判死探针）全部 skip。
          bash tools/ci_git_push.sh "chore: 源更新 $(date -u +%FT%TZ)" \
            dist reports state archive src/sources.yaml

      - name: 发布到 gh-pages（手机订阅站点根）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github src reports state archive
          mv dist/* .
          rmdir dist 2>/dev/null || true
          touch .nojekyll
          git add -A
          git commit -m "pages: $(date -u +%FT%TZ)"
          git push -f origin gh-pages-new:gh-pages
          echo "订阅入口: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/profile.yaml"

      # ========== 源健康体检（只读，不影响上面已发布的产物） ==========
      # mihomo linux 版，用于跑真实 youtube 探针。缓存下载结果，避免每轮重下 22MB。
      - name: 缓存 mihomo 内核
        id: mihomo
        uses: actions/cache@v4
        with:
          path: .tools
          key: mihomo-${{ runner.os }}-${{ hashFiles('.tools/VERSION') }}

      - name: 准备 mihomo 内核
        run: |
          mkdir -p .tools
          VER=$(cat .tools/VERSION 2>/dev/null || echo "v1.19.32")
          if [ ! -x ".tools/mihomo" ]; then
            curl -fsSL --retry 3 \
              "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz" \
              | gunzip > .tools/mihomo
            chmod +x .tools/mihomo
            echo "$VER" > .tools/VERSION
          fi
          .tools/mihomo -v | head -1

      - name: 真探针（美国口径：只判死，不判优）
        run: |
          git checkout main
          # 显式 --scope ci：runner 在美国，只能判「是否彻底死了」，不能横向比质量
          # （实测美国口径虚高 1.8~13 倍，Spearman rho 仅 0.48；shaoyouvip 美国#4/国内#11）
          #
          # ⚠ 这里**故意用全量、不抽样**：降级判据是 alive==0，只有全量测完这个信号才可信。
          #   抽样 n 个后全死的误判概率是 (1-r)^n，而且节点失效是**相关**的
          #   （上游换一批 IP 会成片死），独立性假设不成立，实际比公式更危险。
          #   本仓是 public，Actions 分钟数免费，多花点时间换判死的可靠性是划算的。
          #
          # ⚠ 别用 --hc-timeout 省钱：它直接线性偏置 alive（shaoyouvip 实测
          #   3s->0 活、8s->4 活、15s->6 活）。CI 的活儿就是判死，**假阴性正是致命伤**。
          #
          # 预算仍留大，但实测已远没有那么久：2026-10-16 修掉 sni 型的畸形节点后，
          # 全量探针 262 秒就收敛（12/12 源全测完）。以前跑满预算也不收敛，
          # 真因是一个加载不了的 provider 会让收敛判定永不成立（见 README §9 sni 条）。
          python src/probe.py --mihomo "$PWD/.tools/mihomo" --budget 2400 --scope ci

      - name: 源健康档案（降级只认 CI 口径；回收只认本机口径）
        run: python src/health.py

      - name: 提交健康档案
        run: |
          # 同样走带重试的推送：这一步失败会让「候选池」那步一起 skip，
          # 而健康档案少一轮 = CI 口径判死要攒的轮数被悄悄推迟。
          bash tools/ci_git_push.sh "chore: 源健康档案 $(date -u +%FT%TZ)" \
            state archive src/sources.yaml

      # ========== 新源发现（只进候选池，绝不自动入池） ==========
      # 手动触发时跳过（cron 那次才跑）—— 新源发现不需要很勤，候选池要经真探针评估才值得动
      # ⚠ 不能用 `github.run_number % 2` —— GitHub Actions 表达式**不支持取模**，会直接 422 拒解析
      - name: 发现新共享源（进候选池）
        if: ${{ github.event_name == 'schedule' }}
        run: python src/discover.py

      - name: 提交候选池
        if: ${{ github.event_name == 'schedule' }}
        run: |
          bash tools/ci_git_push.sh "chore: 新源候选池 $(date -u +%FT%TZ)" data

      # ========== 自动补员（2026-10-29 拍板「补员也自动化处理」） ==========
      # 消费本机评估通道 data/eval_verdicts.json（eval/候选池/补员三通道各一个写者，
      # 零冲突）。cap 内（enabled < 12）且节流过（距上次补员 >= 24h）才补，
      # 每轮至多 1 个；cap 满 = approved 候选挂待用，等降级腾位。
      # 放在最后一步：任何失败只红自己，不连带 skip 上游的判死/发布/发现步骤。
      # 手动触发跳过（同 discover：cron 那次才跑）。
      - name: 自动补员（approved 候选补位）
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python src/refill.py
          bash tools/ci_git_push.sh "chore: 自动补员 $(date -u +%FT%TZ)" \
            src/sources.yaml state/refill_last.json