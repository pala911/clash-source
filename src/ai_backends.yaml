# AI 后端清单（多后端自动故障转移）
#
# key 不写在这里，只写「从哪个环境变量读」——不进 git、不落文件。
# 本地/CI 注入方式：
#   $env:AI_KEY_SILICONFLOW = "sk-..."
#   $env:AI_KEY_OPENROUTER  = "sk-or-..."
#
# 顺序即优先级：某个后端连续失败（429/超时/非 JSON）会自动切下一个，
# 报告 reports/latest.md 里会记每个后端实际服务了多少批。

backends:
  - name: siliconflow_xing
    base_url: https://api.siliconflow.cn/v1
    model: XingChenAGI/Xing4.0-29B
    env_key: AI_KEY_SILICONFLOW
    timeout: 180
    retries: 1
    max_tokens: 8000
    note: >-
      首选（2026-10-14 实测反直觉：它比 Qwen3-8B 更快更省）。
      15 簇真实 prompt：49.7s / completion 1651 token / finish=stop / JSON 可解析。
      推理模型会先想再答，结论比非推理模型干净。

  - name: siliconflow_qwen3_8b
    base_url: https://api.siliconflow.cn/v1
    model: Qwen/Qwen3-8B
    env_key: AI_KEY_SILICONFLOW
    timeout: 200
    retries: 1
    max_tokens: 1200
    note: >-
      备用（原先是首选，实测被推翻）。
      同样的 15 簇 prompt：167.9s / completion 3957 token —— 它会把每个簇都解释一遍，
      慢的根源是输出啰嗦而非输入；max_tokens 限 1200 逼它只报要删的，
      若被截断（finish=length）走「放大重试」一次。

  - name: openrouter_gemma
    base_url: https://openrouter.ai/api/v1
    model: google/gemma-4-31b-it:free
    env_key: AI_KEY_OPENROUTER
    timeout: 60
    retries: 1
    note: >-
      末位备份。免费共享池常 429（2026-10-14 全天实测基本没成功过），
      国内到 openrouter 偶发 WinError 10060；只试 1 次 60s 意思一下即可。