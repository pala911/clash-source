# 手机 profile 模板 —— 由 mk_profile_template.py 从生产 clash-verge.yaml 抽取
# proxy-providers 段由 build.py 注入（指向本仓 gh-pages）；不要手改 providers
# 12 源档位依据 2026-10-13 youtube 真探针；自动组探针全 youtube，规则集走 gh-proxy
# profile.store-selected（2026-10-31）：记住手动选择（PROXY/备用/Claude/Gemini 的
#   钉住）。没有它，iOS 每次切网/后台回收触发重载后手动选择全部丢失回到默认 ——
#   「钉住备用组」这类操作会被重载悄悄洗掉。
profile:
  store-selected: true
# sniffer（2026-10-31）：修 iOS 日志实证的「QUIC UDP 不带 fake-ip 域名元数据 →
#   googlevideo 等域名 UDP 漏走 DIRECT 必死」。parse-pure-ip 让纯 IP 连接也嗅探；
#   override-destination 关掉以免改动直连目标的解析行为（只影响规则匹配）。
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
mode: rule
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fallback:
  - 8.8.8.8
  - 1.1.1.1
  fallback-filter:
    geoip: false
    geoip-code: CN
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.home.arpa'
  - '*.example'
  - '*.invalid'
  - '*.localhost'
  - '*.test'
  - localhost
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - +.pool.ntp.org
  - +.xboxlive.com
  - xbox.*.*.microsoft.com
  - +.stun.playstation.net
# 家庭 LAN 里的 ShellCrash HTTP 代理，仅在家庭网络可用。
# 它只作为 PROXY 组里的手动切换项，不参与 AUTO/FAILOVER 的健康检查。
proxies:
- name: 家里路由
  type: http
  server: 192.168.31.1
  port: 7890
  udp: false
