# 上游源清单 —— pipeline 的唯一事实来源
#
# url             : 上游订阅地址（CI 在 GitHub runner 直连 raw；本地/CN 自动回退镜像）
# enabled         : 是否纳入
# exclude_filter  : 该源的命名过滤正则（**逐源取生产实测值，不要统一化**）
# drop_types      : 额外要丢的协议（默认不丢；明文 http/socks5 实测可用，见下）
# max_nodes       : 产出上限（0 = 不限），控制手机 health-check 规模
# note            : 评估结论留痕
#
# 为什么 exclude_filter 必须逐源：
#   ssrsub 的正常节点名就是「🇮🇩 机场推荐:dafei.de 印尼 01」——套用含「推荐」的标准串会
#   把 140 个可用 http 代理全删光（2026-10-13 实测：统一过滤会让 ssrsub 直接归零）。
#   所以生产配置里 ssrsub 单独用 `机场推荐:dafei\.de 德国 07|🇨🇳CN_[0-9]`。
#
# 2026-10-13 实测（youtube 真探针）：
#   ermaozi 20% / zhuhaiuk 52% / ssrsub 43% / ruk1ng001 38% / snakem982 21%
#   nomorewalls 14% / autojiedian 12% / shaoyouvip 10%
#   已排除（0%）：clashfree(611→0) Au1rxx(1745→2) mahdibland Eternity(美机测速 200→0)
#   已消亡：barry-far(仓库被 GitHub 封禁) pepedog/404 soroushmirzaei/404

# 兜底过滤（未单独指定 exclude_filter 的源用这个）
exclude_filter_default: '(?i)(推荐|广告|订阅|官网|网址|域名|加群|群|电报|telegram|t\.me|https?://|www\.|一元|试用|试看|购买|续费|到期|过期|剩余|重置|频道|@|🇨🇳CN_[0-9])'

sources:
  # ===== 2026-10-13 真探针新测出的高价值源 =====
  - name: yypool
    url: https://raw.githubusercontent.com/yy1588133/proxy-pool/main/clash.yaml
    enabled: true
    max_nodes: 900
    note: 🏆 800 产出→200 通过(25%)，最快 75ms；上游就是现有源的聚合去重版（freeSub/NoMoreWalls/AutoMergePublicNodes/zhuhaiuk/get_subscribe/clashfree/Free-servers），补宽度+质量都最划算
    probe_interval: 180
  - name: anaer
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/anaer/clash.yaml
    enabled: true
    note: 🏆 33 产出→26 通过(78.8%)，密度全场最高；用的是清洗版（去控制字符，Clash YAML 可直读）；anaer/Sub 原仓 09-17 时是 4/626
  - name: passcro
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/passcro/clash.yaml
    enabled: true
    note: 145 产出→21 通过(14.5%)，89% 是 http 明文代理
  - name: automerge
    url: https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/main/list.meta.yml
    enabled: true
    note: 235 产出→29 通过(12.3%)，大型聚合，作兜底

  # ===== 原有 8 源（2026-10-13 实测见下）=====
  - name: ermaozi
    url: https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml
    enabled: true
    max_nodes: 800
    exclude_filter: '(?i)(过期|剩余|流量|官网|订阅|加群|电报|telegram|t\.me|https?://)'
    note: 352 测/69 活(20%)→当日复测 500 产出/34 活(6.8%，上游 12h 换池+晚高峰)；价值主要在 http 段

  - name: zhuhaiuk
    url: https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/clash_config.yaml
    enabled: true
    note: 52% 通过率，量小质优（AUTO 首选）；节点多为 http CONNECT

  - name: ssrsub
    url: https://raw.githubusercontent.com/ssrsub/ssr/master/clash.yaml
    enabled: true
    exclude_filter: '机场推荐:dafei\.de 德国 07|🇨🇳CN_[0-9]'
    note: 43% 通过率，主力是 dafei.de 免费机场 http 代理（生产原值，勿改成标准串）

  - name: ruk1ng001
    url: https://raw.githubusercontent.com/Ruk1ng001/freeSub/main/clash.yaml
    enabled: true
    note: 38% 通过率

  - name: snakem982
    url: https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml
    enabled: true
    note: 21% 通过率

  - name: nomorewalls
    url: https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.meta.yml
    enabled: true
    note: 14% 通过率

  - name: autojiedian
    url: https://hvwin8.github.io/autojiedian/clash.yaml
    enabled: true
    note: 12% 通过率但 2100+ 节点，兜底宽度池

  - name: shaoyouvip
    url: https://raw.githubusercontent.com/shaoyouvip/free/refs/heads/main/all.yaml
    enabled: true
    note: 10% 通过率，主体为 http 明文代理；观察中，AI 复核仍无用则下轮摘掉

  # ===== 2026-10-28 候选池评估接入（tools/eval_candidates.py 本机真探针）=====
  # 97 条 pending 首轮全清：77 rejected / 20 approved；此为 approved 前三名。
  # 注意：均为单轮结果，照常走 AI 审核 + 降级机制兜底。
  - name: clashdaily
    url: https://cnb.cool/StriveGlory/clash-daily/-/git/raw/main/dist/clash.yaml
    enabled: true
    max_nodes: 900
    note: 🏆 2026-10-28 实测 40% 通过(60 抽样 24 活)最快 334ms，全场最强；cnb.cool 直连（无镜像回退链）
  - name: leilaomi
    url: https://raw.githubusercontent.com/LeilaoMi/AutoMergePublicNodes-Optimized/main/output/verified.yaml
    enabled: true
    max_nodes: 900
    note: 2026-10-28 实测 32% 通过(17 活)930ms；automerge 的 verified 二次清洗分支
  - name: wzmfree
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/freesub/clash.yaml
    enabled: true
    note: 2026-10-28 实测 23% 通过(14 活)1159ms；与 anaer/passcro 同仓的新产物（镜像链按 raw 走）

# 已评估但未纳入（改 enabled: true 即恢复）
excluded:
  - name: clashfree
    url: https://raw.githubusercontent.com/free-nodes/clashfree/main/sub.yml
    reason: sub.yml 为空文件；按日命名文件 611 节点 youtube 0% 通过
  - name: au1rxx
    url: https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml
    reason: 1745 节点仅 2 个通过（自测只保 TCP 存活，印证坑 §5）
  - name: mahdibland
    url: https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/Eternity.yml
    reason: 美机 LiteSpeedTest 筛出的 200 个节点，国内 youtube 0% 通过