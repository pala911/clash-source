# clash-source 自动生成 —— 手机订阅入口
# 主:  https://pala911.github.io/clash-source/profile.yaml
# 备1 jsdelivr（免 Pages 设置，国内直连实测可达）:
#   https://cdn.jsdelivr.net/gh/pala911/clash-source@gh-pages/profile.yaml
# 备2 gh-proxy raw（github.io 不达时）:
#   https://gh-proxy.com/raw.githubusercontent.com/pala911/clash-source/gh-pages/profile.yaml
# 备3 gh-proxy raw（main 分支）:
#   https://gh-proxy.com/raw.githubusercontent.com/pala911/clash-source/main/dist/profile.yaml
mode: rule
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fallback:
  - 8.8.8.8
  - 1.1.1.1
  fallback-filter:
    geoip: false
    geoip-code: CN
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.home.arpa'
  - '*.example'
  - '*.invalid'
  - '*.localhost'
  - '*.test'
  - localhost
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - +.pool.ntp.org
  - +.xboxlive.com
  - xbox.*.*.microsoft.com
  - +.stun.playstation.net
proxies:
- name: 家里路由
  type: http
  server: 192.168.31.1
  port: 7890
  udp: false
proxy-groups:
- name: SRC-yypool
  type: url-test
  use:
  - yypool
  url: https://www.youtube.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 200
- name: SRC-automerge
