# clash-source 移动端精简版（iOS 网络扩展内存优化，2026-11-02）
# 订阅 URL（任选其一）：
# 主:  https://pala911.github.io/clash-source/mobile.yaml
# 备1 gh-proxy raw（零缓存）:
#   https://gh-proxy.com/raw.githubusercontent.com/pala911/clash-source/gh-pages/mobile.yaml
# 备2 gh-proxy raw（main 分支）:
#   https://gh-proxy.com/raw.githubusercontent.com/pala911/clash-source/main/dist/mobile.yaml
# 说明：单 provider（~120 节点）+ rule-provider 全 lazy；
#   不含 fallback/load-balance（Karing 官方不支持，只有 select/url-test）。
#   完整多源版见同目录 profile.yaml（桌面端用，iOS 上会因内存被杀）。
profile:
  store-selected: true
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
mode: rule
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fallback:
  - 8.8.8.8
  - 1.1.1.1
  fallback-filter:
    geoip: false
    geoip-code: CN
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.home.arpa'
  - '*.example'
  - '*.invalid'
  - '*.localhost'
  - '*.test'
  - localhost
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - +.pool.ntp.org
  - +.xboxlive.com
  - xbox.*.*.microsoft.com
  - +.stun.playstation.net
proxy-groups:
- name: AUTO
  type: url-test
  use:
  - mobile
  url: https://www.youtube.com/generate_204
  expected-status: 204
  interval: 120
  timeout: 5000
  tolerance: 200
- name: PROXY
  type: select
  proxies:
  - AUTO
  - DIRECT
  use:
  - mobile
- name: Claude
  type: select
  proxies:
  - PROXY
  use:
  - mobile
- name: Gemini
  type: select
  proxies:
  - PROXY
  use:
  - mobile
rule-providers:
